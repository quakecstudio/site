name: Deploy

# Every deploy goes to dev first; prod follows only if dev succeeded, and
# waits for approval in the prod environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-environment.yml # zizmor: ignore[self-repository] actionlint lacks $/ (rhysd/actionlint#760)
    with:
      environment: dev

  prod:
    needs: dev
    # The prod environment only accepts main; a manual run from another
    # branch stops after dev.
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-environment.yml # zizmor: ignore[self-repository] actionlint lacks $/ (rhysd/actionlint#760)
    with:
      environment: prod
