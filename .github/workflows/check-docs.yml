name: Check docs

# The user guide's pages: one h1, alt text, links and anchors that resolve, and every help
# link the app opens (apps/desktop/help-links.txt in quakecstudio/editor) present.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/check-docs.py --help-links https://raw.githubusercontent.com/quakecstudio/editor/main/apps/desktop/help-links.txt
